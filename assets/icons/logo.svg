<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#060A14" rx="224"/>

  <!-- Eighth note: stem + head + flag -->
  <g fill="#E8A020">
    <!-- Note head -->
    <ellipse cx="348" cy="636" rx="96" ry="74"
             transform="rotate(-18 348 636)"/>
    <!-- Stem -->
    <rect x="430" y="236" width="32" height="418" rx="16"/>
    <!-- Flag -->
    <path d="M462 236
             C570 256 618 330 600 418
             C620 344 588 266 462 252 Z"/>
  </g>

  <!-- Logotype -->
  <text x="512" y="820"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="148"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-2">MoodTune</text>
</svg>
