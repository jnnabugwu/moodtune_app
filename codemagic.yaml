workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jmagic.moodtune
      vars:
        BUNDLE_ID: com.jmagic.moodtune
        APP_STORE_APP_ID: 6774329207 
        XCODE_WORKSPACE: Runner.xcworkspace
        XCODE_SCHEME: Runner
      groups:
        - Supabase   # must contain: SUPABASE_URL, SUPABASE_ANON_KEY
        - Sentry     # must contain: SENTRY_DSN
        - MoodTune   # must contain: API_BASE_URL, JAMENDO_CLIENT_ID
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install
      - name: Set up signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Determine build number
        script: |
          BUILD_NAME=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID") + 1))
          echo "Using version $BUILD_NAME ($BUILD_NUMBER)"
          echo "BUILD_NAME=$BUILD_NAME" >> $CM_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --flavor production \
            --target lib/main_production.dart \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testing
