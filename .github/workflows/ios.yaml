name: ios_on_device

# Builds the app for an iOS simulator and runs the integration tests, which
# exercise the native parts unit tests can't reach: the AVAudioFile decoder
# behind `moodtune/audio_decode` and YAMNet through flutter_litert.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "ios/**"
      - "integration_test/**"
      - "assets/models/**"
      - "lib/features/on_device_mood/**"
      - "lib/features/narration/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios.yaml"
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # FoundationModels (narration) needs the iOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Integration tests
        run: >
          flutter test integration_test
          --flavor development
          -d ${{ steps.simulator.outputs.udid }}
