name: moodtune_app
description: An app that analyzes songs and playlists
version: 1.0.0+9
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  app_links: ^7.2.2
  bloc: ^9.2.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  device_info_plus: ^12.4.0
  dio: ^5.11.1
  equatable: ^2.0.5
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_litert: ^3.9.3
  flutter_localizations:
    sdk: flutter
  get_it: ^7.6.4
  go_router: ^12.1.3
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  just_audio: ^0.9.40
  package_info_plus: ^9.0.1
  rxdart: ^0.28.0
  sentry_dio: ^10.1.0
  sentry_flutter: ^10.1.0
  shadcn_ui: ^0.43.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.12.0
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.16
  url_launcher: ^6.2.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  sentry_dart_plugin: ^3.4.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/models/

  # Inter Tight (OFL, assets/fonts/OFL.txt). The brand wordmark and the share
  # card use it; the share card is rasterized, so the real font must ship.
  fonts:
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTight-Bold.ttf
          weight: 700

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: moodtune-app
  org: jordan-nnabugwu

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  # Adaptive icon: full-bleed gradient foreground over terracotta background.
  # The gradient fills the safe zone so the background only peeks through
  # on extreme parallax — terracotta (#d4885f) is the gradient's mid-stop.
  adaptive_icon_background: "#d4885f"
  adaptive_icon_foreground: "assets/icons/icon.png"
