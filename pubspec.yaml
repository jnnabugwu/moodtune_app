name: moodtune_app
description: An app that analyzes songs and playlists
version: 1.0.0+2
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  app_links: ^6.2.0
  bloc: ^9.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.3.2
  equatable: ^2.0.5
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^7.6.4
  go_router: ^17.0.1
  intl: ^0.20.2
  just_audio: ^0.9.40
  rxdart: ^0.28.0
  sentry_dio: ^9.10.0
  sentry_flutter: ^9.10.0
  shadcn_ui: ^0.43.0
  supabase_flutter: ^2.12.0
  talker_dio_logger: ^4.1.0
  talker_flutter: ^4.1.0
  url_launcher: ^6.2.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  sentry_dart_plugin: ^3.2.1
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: moodtune-app
  org: jordan-nnabugwu

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  # Adaptive icon: full-bleed gradient foreground over terracotta background.
  # The gradient fills the safe zone so the background only peeks through
  # on extreme parallax — terracotta (#d4885f) is the gradient's mid-stop.
  adaptive_icon_background: "#d4885f"
  adaptive_icon_foreground: "assets/icons/icon.png"
